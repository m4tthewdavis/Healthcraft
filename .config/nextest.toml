# cargo-nextest (https://nexte.st). Optional locally; `cargo test` keeps working.
#
#   cargo nextest run --workspace        # all tests except doctests
#   cargo test --doc --workspace         # nextest does not run doctests

# CI (`--profile ci`): stop at the first failure, fail a hung test, repeat failures at the end.
[profile.ci]
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"

[package]
name = "healthcraft"
description = "HealthCraft desktop: the clinician UI as a native app (egui/eframe on wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "healthcraft"

[lints]
workspace = true

[dependencies]
healthcraft-core = { workspace = true }
healthcraft-engine = { workspace = true }
healthcraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["wgpu", "accesskit", "default_fonts", "wayland", "x11"] }
egui = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }

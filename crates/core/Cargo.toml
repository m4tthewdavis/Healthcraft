[package]
name = "healthcraft-core"
description = "HealthCraft foundation: typed ids, actors and roles, clocks, input limits"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

# Random ids and the wall clock exist only on native targets: wasm32-unknown-unknown has neither a
# random source nor a clock without JavaScript glue, so the browser build injects its own.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["now"] }

[dev-dependencies]
serde_json = { workspace = true }
